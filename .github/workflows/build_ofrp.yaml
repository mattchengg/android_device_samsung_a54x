name: Build OFRP

on:
  workflow_dispatch:
  
jobs:
  build_recovery:
    runs-on: ubuntu-latest
        
    steps:          
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main
        
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Preserve pre-build patch
        run: |
          mkdir -p ~/patches
          cp "${GITHUB_WORKSPACE}/0001-updater-remap-read-only-dynamic-partitions-as-writab.patch" ~/patches/
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Set date variable
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Install repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup Env
        run: |
          sudo apt install git aria2 -y
          git clone https://gitlab.com/OrangeFox/misc/scripts ~/scripts
          cd ~/scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Initialize repo
        run: |
          export WORK_DIR="$(pwd)"
          cd ~/scripts
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path $WORK_DIR/fox-12.1

      - name: Cloning Trees
        run: |
          git clone -b fox-12.1 https://github.com/mattchengg/android_device_samsung_a54x.git device/samsung/a54x
        working-directory: ./fox-12.1

      - name: Apply pre-build patch
        run: |
          PATCH_FILE=~/patches/0001-updater-remap-read-only-dynamic-partitions-as-writab.patch
          if git apply --check "${PATCH_FILE}"; then
            git apply "${PATCH_FILE}"
          elif git apply --reverse --check "${PATCH_FILE}"; then
            echo "Patch already applied: ${PATCH_FILE}"
          else
            echo "Patch cannot be applied cleanly: ${PATCH_FILE}" >&2
            exit 1
          fi
        working-directory: ./fox-12.1
      
      - name: Build Recovery
        run: |
          set +e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=a54x
          export LC_ALL="C"
          source build/envsetup.sh
          set -e
          lunch twrp_a54x-eng && make clean && mka recoveryimage
        working-directory: ./fox-12.1

      - name: Publish to GitHub
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: /home/runner/work/android_device_samsung_a54x/android_device_samsung_a54x/fox-12.1/out/target/product/a54x/*.zip
          name: OrangeFox 12.1
          tag_name: "${{ env.DATE }}"
          body: |
            VBMeta Patched:
            https://github.com/Vaz15k/proprietary_vendor_samsung_a54x/releases
            
            :rocket: *Built with love by GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
